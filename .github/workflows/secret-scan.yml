# Secret scan: runs gitleaks over the commits in a pull request, and over the whole
# git history on every push to main. Free: uses the gitleaks release binary
# (MIT licensed) straight from GitHub releases, verified against the release's
# checksums file. No license key, no third-party action, no secrets needed.
# Findings are redacted in the log; the job fails if anything is found.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o "$tarball" "$base/$tarball"
          curl -sSfL --retry 3 -o "$sums" "$base/$sums"
          grep " ${tarball}\$" "$sums" | sha256sum --check --strict -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 .
