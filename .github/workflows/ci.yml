# FEATURE — Checks for the Health Dashboard.
# swift-tests-linux runs the SwiftPM calculation/biomarker tests on every pull request and
# every push to main, on a free Linux runner inside the official Swift Docker image.
# test-and-build (macOS: SwiftPM tests + unsigned iOS compile) runs only when started by
# hand (Actions tab > CI > Run workflow), because macOS runners are not currently
# available to this repo, see
# https://github.com/jeffreykkirkwood-commits/health-dashboard/issues/7.
# Device testing on a real iPhone is the release check.
# No signing keys, provisioning profiles or real health data are used.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FEATURE 01 — Calculation and biomarker tests on Linux (Package.swift, 12 tests).
  # Only HealthCore.swift and Biomarkers.swift are in the package, so no Apple-only
  # frameworks (HealthKit, SwiftUI, UserNotifications) are needed here.
  swift-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run package tests
        run: swift test

  # FEATURE 02 — macOS: package tests plus an unsigned compile of the iPhone app.
  # Manual only: the `if:` keeps it from queueing on pull requests and main, where it
  # would wait for a macOS runner and then be cancelled.
  test-and-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The catalog targets the iOS 27.1 SDK. Pick the newest Xcode on the runner and
      # print its version so an older SDK is easy to spot in the log.
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Swift package tests
        run: swift test

      # The HealthDashboard scheme has no test action or XCTest target yet, so
      # `xcodebuild test -scheme HealthDashboard` would fail; tests run through SwiftPM above.
      - name: Unsigned iOS build
        run: >
          xcodebuild -project HealthDashboard.xcodeproj
          -scheme HealthDashboard
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
